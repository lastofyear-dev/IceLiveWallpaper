name: Build Mountain Lake APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: unzip -q IceLiveWallpaper_MountainLake_APK_project.zip -d project

      - name: Build APK
        run: cd project/ice_live_wallpaper_project && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mountain-Lake-APK
          path: project/ice_live_wallpaper_project/app/build/outputs/apk/debug/app-debug.apk
